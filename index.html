<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14100f">
  <meta name="description" content="A personal film archive — posters, trailers and little notes on films worth keeping.">
  <title>Film</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="glow glow-a"></span><span class="glow glow-b"></span></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Film home"><span class="brand-mark" lang="hi">फ़</span><span>Film</span></a>
    <nav aria-label="Main navigation">
      <a href="#featured">Now showing</a>
      <a class="active" href="#collection">Collection</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" id="featured" aria-label="Featured film"></section>

    <section class="collection" id="collection">
      <div class="section-heading">
        <div>
          <p class="eyebrow">The archive</p>
          <h2>All films <span id="film-count">(00)</span></h2>
        </div>
        <div class="collection-tools">
          <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search titles, genres…" aria-label="Search films"><kbd aria-hidden="true">/</kbd></label>
          <button class="sort-button" id="sort-button" type="button">Recently added <span aria-hidden="true">↕</span></button>
        </div>
      </div>
      <div class="language-tabs" id="language-tabs" role="tablist" aria-label="Filter movies by language"></div>
      <div class="film-grid" id="film-grid"></div>
      <p class="empty-state" id="empty-state" hidden>Nothing on the reel for that — try another search.</p>
    </section>
  </main>

  <footer>
    <a class="brand footer-brand" href="#top"><span class="brand-mark" lang="hi">फ़</span><span>Film</span></a>
    <span class="footer-note">A personal film archive · kept with love</span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <dialog id="poster-dialog" class="poster-dialog"><button class="dialog-close" id="close-poster" type="button" aria-label="Close poster">×</button><img id="poster-preview" alt="Movie poster"></dialog>
  <dialog id="detail-dialog" class="detail-dialog"><button class="dialog-close" id="close-detail" type="button" aria-label="Close trailer">×</button><div id="detail-content"></div></dialog>
  <script src="script.js"></script>
</body>
</html>
