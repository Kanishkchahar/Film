<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Film">
  <meta name="description" content="A quiet, warm shelf of films worth keeping — trailers, posters and a line on why each one is here.">
  <title>Film — a personal archive of films I love</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Film — a personal archive of films I love">
  <meta property="og:description" content="A quiet, warm shelf of films worth keeping.">
  <meta property="og:image" content="og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=6">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#collection">Skip to films</a>
  <div class="ambient" aria-hidden="true"><span class="glow glow-a"></span><span class="glow glow-b"></span></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Film home"><span class="brand-mark" lang="hi">फ़</span><span>Film</span></a>
    <nav aria-label="Main navigation">
      <a class="active" href="#collection">Collection</a>
    </nav>
  </header>

  <main id="top">
    <section class="collection" id="collection" aria-labelledby="collection-title">
      <div class="section-heading" id="collection-heading">
        <div>
          <p class="eyebrow">The archive</p>
          <h1 id="collection-title">All films <span id="film-count" aria-live="polite">(00)</span></h1>
        </div>
        <div class="collection-tools">
          <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search titles, genres…" aria-label="Search films" autocomplete="off" spellcheck="false" enterkeyhint="search"><kbd aria-hidden="true">/</kbd></label>
          <button class="surprise-button" id="surprise-button" type="button" aria-label="Surprise me with a random film"><span class="surprise-glyph" aria-hidden="true">✦</span> Surprise me</button>
          <button class="sort-button" id="sort-button" type="button">Recently added <span aria-hidden="true">↕</span></button>
        </div>
      </div>
      <div class="language-tabs" id="language-tabs" role="tablist" aria-label="Filter movies by language"></div>
      <div class="film-grid" id="film-grid" role="tabpanel" aria-labelledby="tab-all" tabindex="0"></div>
      <p class="empty-state" id="empty-state" role="status" hidden>Nothing on the reel for that — try another search.</p>
      <noscript><p class="empty-state">This shelf needs JavaScript to light the projector.</p></noscript>
    </section>
  </main>

  <footer>
    <a class="brand footer-brand" href="#top"><span class="brand-mark" lang="hi">फ़</span><span>Film</span></a>
    <span class="footer-note">A personal film archive · kept with love</span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <dialog id="poster-dialog" class="poster-dialog" aria-label="Film poster"><button class="dialog-close" id="close-poster" type="button" aria-label="Close poster">×</button><img id="poster-preview" alt="Movie poster"></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="Film details"><button class="dialog-close" id="close-detail" type="button" aria-label="Close trailer">×</button><div id="detail-content"></div></dialog>
  <script src="script.js"></script>
</body>
</html>
